<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戦陣棋｜α0.4</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#e9edf5;background:#111827}*{box-sizing:border-box}body{margin:0 auto;padding:12px;max-width:1100px}h1{font-size:1.6rem;margin:0 0 8px}small,.muted{color:#aab4c4}.top,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.pill{background:#273348;padding:8px 11px;border-radius:9px}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 11px;background:#334155;color:#fff}button:disabled{opacity:.4}.primary{background:#2563eb}.layout{display:flex;gap:20px;flex-wrap:wrap}.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));width:min(100%,690px);aspect-ratio:1;border:3px solid #bda67e;background:#e9d5ae;touch-action:manipulation}.cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:0;border-radius:0;border-right:1px solid #a99775;border-bottom:1px solid #a99775;background:#e7d4b0;color:#111827}.cell:nth-child(even){background:#e4cca4}.cell.sel{outline:3px solid #1d4ed8;outline-offset:-3px;z-index:1}.cell.legal{box-shadow:inset 0 0 0 3px #16a34a}.cell.target{box-shadow:inset 0 0 0 3px #dc2626}.piece{width:85%;height:85%;display:flex;align-items:center;justify-content:center;border-radius:5px;border:1px solid #475569;font-size:clamp(14px,3.1vw,28px);font-weight:900;line-height:1}.piece.blue{background:#c7ddfa;color:#12325d}.piece.red{background:#f8b4b4;color:#701b1b}.hp{position:absolute;bottom:0;right:1px;font-size:clamp(8px,1.5vw,12px);background:#ffffffba;border-radius:3px;padding:0 2px}.stack{position:absolute;top:0;left:1px;font-size:clamp(9px,1.5vw,12px);font-weight:800;background:#fef08a;padding:0 2px;border-radius:2px}.side{flex:1;min-width:250px;max-width:330px}.panel{background:#1e293b;padding:13px;border-radius:12px;margin-bottom:12px}.note{font-size:13px;line-height:1.65;color:#d1d5db}#log{max-height:220px;overflow:auto;font-size:13px;line-height:1.7}#log div{border-bottom:1px solid #334155;padding:3px 0}.stackItem{display:block;width:100%;margin:5px 0;text-align:left}.status{padding:9px 12px;background:#14532d;border-radius:8px;margin-bottom:10px;font-size:13px}@media(max-width:640px){body{padding:8px}.layout{display:block}.side{max-width:none}.piece{border-radius:3px}}
</style></head><body><h1>⚔️ 戦陣棋 <small>オフライン試作版 α0.4</small></h1><div class="top"><span class="pill" id="turn"></span><span class="pill" id="status"></span><button id="reset">最初から</button><button id="flip">盤面を180°回転</button></div><div id="runtime" class="status">JavaScriptを読み込んでいます…</div><div class="layout"><div id="board" class="board" aria-label="戦陣棋盤面"></div><div class="side"><div class="panel"><b>選択中の駒・重なり情報</b><div id="info" class="note"></div><div id="stackInfo" class="note"></div><div class="actions" id="actions"></div></div><div class="panel"><b>対局ログ</b><div id="log"></div></div><div class="panel note"><b>α0.4の変更</b><p>砲撃は方向を選択し、射程内の全駒に1ダメージ。諜の支配は支配側の行動を3回数え、終了時に諜のみ帰還。重なった駒は一覧から選択できます。</p><p>移動規則と通常攻撃の方向は正式ルールとの照合が未完了のため、α0.3の暫定規則を維持しています。諜の帰還先は「自陣内の空きマス」として暫定実装しています。</p></div></div></div><script>
'use strict';
window.addEventListener('error',e=>{const r=document.getElementById('runtime');r.style.background='#7f1d1d';r.textContent='JavaScriptエラー: '+e.message});
const N=12,names={基:'基地',指:'指揮官',近:'近衛',突:'突撃兵',騎:'騎兵',砲:'砲兵',諜:'諜報官',伝:'伝令兵',補:'補給兵'};
const initial=['砲','騎','諜','近','指','基','近','諜','騎','砲','伝','伝'];
const second=Array(12).fill('突'),third=['補',null,'騎',null,'砲',null,null,'砲',null,'騎',null,'補'];
let pieces=[],turn='blue',sel=null,mode='move',flipped=false,log=[],ended=false,seq=0,ply=0,priorSieges=new Set(),controlLinks=[];
const other=c=>c==='blue'?'red':'blue',inB=(x,y)=>x>=0&&x<N&&y>=0&&y<N;
const at=(x,y)=>pieces.filter(p=>p.hp>0&&p.x===x&&p.y===y),key=(x,y)=>`${x},${y}`;
const label=c=>c==='blue'?'青':'赤';
function note(s){log.unshift(s);log=log.slice(0,100)}
function add(t,x,y,owner){pieces.push({id:++seq,t,x,y,owner,original:owner,hp:3,homeX:x,homeY:y,occupied:0})}
function setup(){pieces=[];seq=0;ply=0;turn='blue';sel=null;mode='move';ended=false;flipped=false;log=[];priorSieges=new Set();controlLinks=[];for(let x=0;x<N;x++)for(const [t,y] of [[initial[x],11],[second[x],10],[third[x],9]])if(t)add(t,x,y,'blue');const blue=pieces.slice();for(const p of blue)add(p.t,11-p.x,11-p.y,'red');note('対局開始。青が先手。');draw()}
function forward(p){return p.original==='blue'?-1:1}
function clearPath(p,x,y){const dx=Math.sign(x-p.x),dy=Math.sign(y-p.y),steps=Math.max(Math.abs(x-p.x),Math.abs(y-p.y));for(let i=1;i<steps;i++)if(at(p.x+dx*i,p.y+dy*i).length)return false;return true}
function dist(a,b){return Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y))}
function commander(p){return pieces.find(q=>q.hp>0&&q.owner===p.owner&&q.t==='指')}
function controlledSpy(p){return controlLinks.some(l=>l.spyId===p.id)}
function moves(p){if(controlledSpy(p))return [];let out=[],f=forward(p);const put=(dx,dy,jump=false)=>{const x=p.x+dx,y=p.y+dy;if(!inB(x,y))return;const dest=at(x,y);if(dest.some(q=>q.t!=='基'))return;if(!jump&&!clearPath(p,x,y))return;out.push({x,y})};const lines=(dirs,limit,jump=false)=>{for(const [dx,dy] of dirs)for(let n=1;n<=limit;n++)put(dx*n,dy*n,jump)};
switch(p.t){case '基':lines([[1,0],[-1,0],[0,1],[0,-1]],1);break;
case '指':lines([[1,0],[-1,0],[0,1],[0,-1]],2);lines([[1,1],[1,-1],[-1,1],[-1,-1]],1);break;
case '近':lines([[0,1],[0,-1]],3);lines([[1,0],[-1,0]],2);{const c=commander(p);if(c){out=out.filter(m=>Math.abs(m.x-c.x)<=4&&Math.abs(m.y-c.y)<=4);for(const dx of [-1,1])for(const dy of [-1,1]){const m={x:p.x+dx,y:p.y+dy};if(inB(m.x,m.y)&&dist(m,c)<dist(p,c)&&Math.abs(m.x-c.x)<=4&&Math.abs(m.y-c.y)<=4&&!at(m.x,m.y).some(q=>q.t!=='基'))out.push(m)}for(const [dx,dy,max] of [[0,1,3],[0,-1,3],[1,0,2],[-1,0,2]])for(let n=1;n<=max;n++){const m={x:p.x+dx*n,y:p.y+dy*n};if(inB(m.x,m.y)&&dist(m,c)<dist(p,c)&&Math.abs(m.x-c.x)<=4&&Math.abs(m.y-c.y)<=4&&!at(m.x,m.y).some(q=>q.t!=='基'))out.push(m)}}}break;
case '突':lines([[0,1],[0,-1]],5);lines([[1,0],[-1,0]],1);break;
case '騎':put(0,2*f,true);put(-1,-f,true);put(1,-f,true);put(-1,3*f,true);put(1,3*f,true);break;
case '砲':lines([[1,0],[-1,0],[0,1],[0,-1]],1);break;
case '諜':put(0,-f);for(const dx of [-1,1])for(let n=1;n<=2;n++){put(dx*n,n*f);put(dx*n,-n*f)}break;
case '伝':for(const dx of [-1,1])for(const dy of [-1,1]){put(dx,dy);put(2*dx,2*dy)}break;
case '補':put(0,f);put(-1,0);put(1,0);put(-1,f);put(1,f);put(0,-2*f);break;
}return [...new Map(out.map(m=>[key(m.x,m.y),m])).values()]}
function cannonRange(p){return pieces.some(q=>q.hp>0&&q.owner===p.owner&&q.t==='補'&&Math.abs(q.x-p.x)+Math.abs(q.y-p.y)===1)?9:4}
function targets(p){if(controlledSpy(p))return [];if(p.t==='突'){let out=[];for(const [dx,dy,nmax] of [[0,1,5],[0,-1,5],[1,0,1],[-1,0,1]])for(let n=1;n<=nmax;n++){const x=p.x+dx*n,y=p.y+dy*n;if(!inB(x,y))break;const a=at(x,y);if(a.some(q=>q.owner!==turn&&q.t!=='基')){if(clearPath(p,x,y))out.push({x,y});break}if(a.length)break}return out}
if(p.t==='砲'){let out=[];for(const dx of [-1,1])for(const dy of [-1,1]){let last=null;for(let n=1;n<=cannonRange(p);n++){const x=p.x+dx*n,y=p.y+dy*n;if(!inB(x,y))break;last={x,y}}if(last)out.push({...last,dx,dy})}return out}
if(p.t==='諜'){const y=p.y+forward(p);return inB(p.x,y)&&at(p.x,y).some(q=>q.owner!==turn&&q.t!=='基'&&!controlLinks.some(l=>l.targetId===q.id))?[{x:p.x,y}]:[]}
if(p.t==='補')return pieces.filter(q=>q.owner===turn&&q.id!==p.id&&q.hp>0&&q.hp<3).map(q=>({x:q.x,y:q.y}));
if(p.t==='伝')return pieces.filter(q=>q.owner===turn&&['突','騎'].includes(q.t)&&q.hp>0).map(q=>({x:q.x,y:q.y}));return []}
function actions(p){let a=[{id:'move',label:'移動'}];if(['突','砲','諜','補','伝'].includes(p.t))a.push({id:'special',label:{突:'突撃',砲:'砲撃（方向指定）',諜:'支配',補:'回復',伝:'位置交換'}[p.t]});return a}
function damage(p,n=1){if(p.hp<=0)return;p.hp=Math.max(0,p.hp-n);if(p.hp===0)note(`${label(p.original)}の${p.t}が撃破された`)}
function cleanBrokenControls(){for(const l of [...controlLinks]){const spy=pieces.find(p=>p.id===l.spyId),target=pieces.find(p=>p.id===l.targetId);if(!spy||!target||spy.hp<=0||target.hp<=0){if(target&&target.hp>0)target.owner=target.original;controlLinks=controlLinks.filter(a=>a!==l);if(spy&&spy.hp>0&&target&&target.hp<=0)returnSpy(spy);note('諜の支配が終了した')}}}
function returnSpy(spy){let spots=[];const start=spy.original==='blue'?9:0,end=start+2;for(let y=start;y<=end;y++)for(let x=0;x<N;x++)if(at(x,y).length===0)spots.push({x,y});spots.sort((a,b)=>Math.abs(a.x-spy.homeX)+Math.abs(a.y-spy.homeY)-Math.abs(b.x-spy.homeX)-Math.abs(b.y-spy.homeY));const s=spots[0];if(s){spy.x=s.x;spy.y=s.y;note(`${label(spy.original)}の諜が自陣に帰還`)}else{spy.x=spy.homeX;spy.y=spy.homeY;note('帰還先に空きがないため諜は初期位置へ帰還')}}
function endControl(l){const spy=pieces.find(p=>p.id===l.spyId),target=pieces.find(p=>p.id===l.targetId);if(target&&target.hp>0)target.owner=target.original;controlLinks=controlLinks.filter(a=>a!==l);if(spy&&spy.hp>0)returnSpy(spy);note('支配3ターン終了：操作権を返還')}
function siege(){let now=new Set(),hits=[];for(const p of pieces.filter(q=>q.hp>0)){const e=other(p.owner),up=at(p.x,p.y-1).some(q=>q.owner===e),down=at(p.x,p.y+1).some(q=>q.owner===e),left=at(p.x-1,p.y).some(q=>q.owner===e),right=at(p.x+1,p.y).some(q=>q.owner===e);if(up&&down&&left&&right)hits.push([p,3]);else if((up&&down)||(left&&right))hits.push([p,1])}for(const [p,d] of hits){const sig=p.id+':'+d;now.add(sig);if(!priorSieges.has(sig)){if(d===3){damage(p,3);note(`${p.t}が四方向包囲で撃破`)}else{damage(p);note(`${p.t}が二方向包囲で1ダメージ`)}}}priorSieges=now}
function victory(){for(const side of ['blue','red'])if(!pieces.some(p=>p.hp>0&&p.original===other(side)&&p.t!=='基'))return `${label(side)}の勝利（敵軍全滅）`;return null}
function endAction(msg){note(msg);siege();cleanBrokenControls();for(const l of [...controlLinks])if(l.controller===turn&&l.startedPly!==ply){l.turns++;if(l.turns>=3)endControl(l)}let win=victory();if(win){ended=true;document.getElementById('status').textContent=win}else{turn=other(turn);ply++;
// 基地占領は占領側の手番開始時に加算する
for(const b of pieces.filter(p=>p.hp>0&&p.t==='基')){const occupants=at(b.x,b.y).filter(p=>p.id!==b.id&&p.owner!==b.owner);for(const p of pieces)if(p.id!==b.id&&!occupants.includes(p)&&p.occupied>0&&p.x===b.x&&p.y===b.y)p.occupied=0;for(const occupant of occupants){if(turn===occupant.owner){occupant.occupied++;if(occupant.occupied>=3){ended=true;win=`${label(turn)}の勝利（基地占領）`;note(win)}}}}
// 支配側が行動を完了した回数を数える。支配開始の行動は除外。
}sel=null;mode='move';draw();if(win)document.getElementById('status').textContent=win}
function perform(p,x,y){if(ended||p.hp<=0||p.owner!==turn)return;const list=mode==='move'?moves(p):targets(p),choice=list.find(m=>m.x===x&&m.y===y);if(!choice)return;const old=key(p.x,p.y),dest=at(x,y),side=label(turn);let msg=`${side} ${p.t} ${old}→${key(x,y)}`;
if(mode==='move'){const b=dest.find(q=>q.t==='基');const oldX=p.x,oldY=p.y;p.x=x;p.y=y;const link=controlLinks.find(l=>l.targetId===p.id);if(link){const spy=pieces.find(q=>q.id===link.spyId);if(spy&&spy.hp>0){spy.x=x;spy.y=y}msg=`${side} 支配中の${p.t}を移動（諜が随伴）`}
if(p.t==='騎')for(const q of pieces.filter(q=>q.hp>0&&q.owner!==turn&&Math.abs(q.x-x)+Math.abs(q.y-y)===1))damage(q);
if(b&&b.owner!==turn)note('敵基地の占領開始');}
else if(p.t==='突'){const enemy=dest.find(q=>q.owner!==turn&&q.t!=='基');if(enemy){damage(enemy);if(enemy.hp===0){p.x=x;p.y=y}msg=`${side} 突が${enemy.t}に攻撃`}}
else if(p.t==='砲'){let hits=0;for(let n=1;n<=cannonRange(p);n++){const xx=p.x+choice.dx*n,yy=p.y+choice.dy*n;if(!inB(xx,yy))break;for(const q of at(xx,yy)){damage(q);hits++}}msg=`${side} 砲撃 ${choice.dx>0?'右':'左'}${choice.dy<0?'上':'下'}斜め：${hits}駒に各1ダメージ（敵味方含む）`}
else if(p.t==='諜'){const q=dest.find(q=>q.owner!==turn&&q.t!=='基'&&!controlLinks.some(l=>l.targetId===q.id));if(q){q.owner=turn;controlLinks.push({spyId:p.id,targetId:q.id,controller:turn,turns:0,startedPly:ply});p.x=x;p.y=y;msg=`${side} 諜が${q.t}を支配（3自軍手番）`}}
else if(p.t==='補'){const q=dest.find(q=>q.owner===turn&&q.hp<3&&q.id!==p.id);if(q){q.hp=Math.min(3,q.hp+1);msg=`${side} 補が${q.t}を回復：HP${q.hp}/3`}}
else if(p.t==='伝'){const q=dest.find(q=>q.owner===turn&&['突','騎'].includes(q.t));if(q){const a=p.x,b=p.y;p.x=q.x;p.y=q.y;q.x=a;q.y=b;msg=`${side} 伝が${q.t}と位置交換`}}
endAction(msg)}
function draw(){const board=document.getElementById('board');board.innerHTML='';const possible=sel?(mode==='move'?moves(sel):targets(sel)):[],set=new Set(possible.map(m=>key(m.x,m.y)));
for(let vy=0;vy<N;vy++)for(let vx=0;vx<N;vx++){const x=flipped?11-vx:vx,y=flipped?11-vy:vy,cell=document.createElement('button');cell.className='cell';cell.setAttribute('aria-label',`${x+1}列${y+1}行`);const stack=at(x,y),visible=stack.find(p=>p.t!=='基'&&!controlledSpy(p))||stack.find(p=>p.t!=='基')||stack[0];if(visible){const d=document.createElement('div');d.className='piece '+visible.owner;d.textContent=visible.t;cell.append(d);const h=document.createElement('span');h.className='hp';h.textContent=visible.hp;cell.append(h);if(stack.length>1){const s=document.createElement('span');s.className='stack';s.textContent='重'+stack.length;cell.append(s)}}if(sel&&sel.x===x&&sel.y===y)cell.classList.add('sel');if(set.has(key(x,y)))cell.classList.add(mode==='special'?'target':'legal');cell.onclick=()=>{if(ended)return;if(sel&&set.has(key(x,y))){perform(sel,x,y);return}const a=at(x,y);sel=a.find(q=>q.owner===turn&&!controlledSpy(q)&&q.t!=='基')||a.find(q=>q.owner===turn&&!controlledSpy(q))||null;mode='move';draw()};board.append(cell)}
document.getElementById('turn').textContent=`手番：${label(turn)}`;if(!ended)document.getElementById('status').textContent=sel?`${names[sel.t]}：${mode==='move'?'移動先':'能力対象・砲撃方向'}を選択`:'駒を選択してください';const info=document.getElementById('info'),btns=document.getElementById('actions'),stackInfo=document.getElementById('stackInfo');btns.innerHTML='';stackInfo.innerHTML='';info.textContent=sel?`${names[sel.t]}（${sel.t}）HP ${sel.hp}/3　${sel.x+1}列${sel.y+1}行`:'自軍の駒をタップしてください。重なりマスは下の一覧から駒を選択できます。';
if(sel){const stack=at(sel.x,sel.y);if(stack.length>1){const title=document.createElement('p');title.textContent=`このマスには${stack.length}駒あります：`;stackInfo.append(title);for(const p of stack){const b=document.createElement('button');b.className='stackItem';b.textContent=`${label(p.original)} ${names[p.t]}（${p.t}） HP${p.hp}/3${p.owner!==p.original?'［支配中］':''}${p.id===sel.id?' ←選択中':''}`;b.disabled=p.owner!==turn||controlledSpy(p);b.onclick=()=>{sel=p;mode='move';draw()};stackInfo.append(b)}}for(const a of actions(sel)){const b=document.createElement('button');b.textContent=a.label;b.className=mode===a.id?'primary':'';b.onclick=()=>{mode=a.id;draw()};btns.append(b)}if(sel.t==='砲'&&mode==='special'){const n=document.createElement('div');n.className='note';n.textContent=`射程：斜め${cannonRange(sel)}マス。赤枠の4方向の終点をタップすると、その方向の全駒にダメージ。`;btns.append(n)}}
document.getElementById('log').innerHTML=log.map(s=>`<div>${s.replaceAll('&','&amp;').replaceAll('<','&lt;')}</div>`).join('')}
document.getElementById('runtime').textContent='α0.4：砲撃範囲・支配・重なり表示を修正。移動規則は暫定版です。';document.getElementById('reset').onclick=()=>{if(confirm('対局を最初からやり直しますか？'))setup()};document.getElementById('flip').onclick=()=>{flipped=!flipped;draw()};setup();
</script></body></html>
